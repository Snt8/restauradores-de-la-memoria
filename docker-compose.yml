services:
  db:
    image: postgres:18-alpine
    container_name: restauradores-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-restauradores}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restauradores}
      POSTGRES_DB: ${POSTGRES_DB:-restauradores}
    ports:
      # 5433 en el host para no chocar con un PostgreSQL instalado localmente.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
