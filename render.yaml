# Blueprint de Render: base de datos, API y portal en un solo despliegue.
# Guía paso a paso y variables: docs/despliegue.md

databases:
  - name: restauradores-db
    plan: free
    region: oregon
    databaseName: restauradores
    user: restauradores

services:
  - type: web
    name: restauradores-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install .
    # Las migraciones y la carga de contenido son idempotentes: se pueden correr en cada arranque.
    startCommand: alembic upgrade head && python -m seeds.load && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: restauradores-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: restauradores-portal
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # SPA: cualquier ruta que no sea un archivo la resuelve React Router.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Los archivos de /assets llevan hash en el nombre: se pueden guardar en caché para siempre.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
